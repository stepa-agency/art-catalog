<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>where the body fades, bitter herbs grow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f2ec;
    --ink:#141414;
    --line:#141414;
    --muted:#6b6a63;
    --dot:#c9c6ba;
    --dot-active:#141414;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:var(--bg);
    color:var(--ink);
    font-family:'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
  }

  .viewport{
    height:100vh;
    height:100svh;
    overflow-y:scroll;
    scroll-snap-type:y mandatory;
    scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;
  }

  section{
    height:100vh;
    height:100svh;
    scroll-snap-align:start;
    scroll-snap-stop:always;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:6vh 6vw;
  }

  /* ---- cover ---- */
  .cover{
    text-align:left;
    align-items:flex-start;
    justify-content:space-between;
  }
  .cover .top, .cover .bottom{
    width:100%;
  }
  .cover .loc{
    font-size:12px;
    letter-spacing:0.04em;
    line-height:1.6;
    text-transform:uppercase;
    color:var(--ink);
    background:#fff;
    display:inline-block;
    padding:6px 10px;
    box-shadow:0 1px 0 rgba(0,0,0,0.15);
  }
  .cover .title{
    font-size:clamp(28px, 6vw, 56px);
    font-weight:700;
    line-height:1.15;
    letter-spacing:-0.01em;
    max-width:14ch;
    margin:0;
    text-transform:uppercase;
  }
  .cover .meta{
    display:flex;
    gap:8vw;
    font-size:12px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    line-height:1.7;
  }
  .cover .meta b{
    display:block;
    font-weight:700;
  }
  .cover .hint{
    position:absolute;
    bottom:6vh;
    right:6vw;
    font-size:11px;
    color:var(--muted);
    letter-spacing:0.04em;
    text-transform:uppercase;
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:0.35}
    50%{opacity:1}
  }

  /* ---- artwork pages ---- */
  .artwork .frame{
    flex:1;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:0;
    cursor:pointer;
  }
  .artwork img{
    max-width:100%;
    max-height:68vh;
    max-height:68svh;
    object-fit:contain;
    box-shadow:0 2px 24px rgba(0,0,0,0.12);
    background:#fff;
  }

  .placeholder{
    width:min(60vw, 420px);
    aspect-ratio:4/5;
    border:1px dashed var(--muted);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:var(--muted);
    font-size:11px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding:2em;
  }

  .caption{
    width:100%;
    max-width:720px;
    margin-top:3.5vh;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .cap-row{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .cap-row .status.sold{
    color:var(--ink);
    font-weight:700;
  }
  .cap-title{
    font-size:clamp(18px, 3vw, 26px);
    font-weight:500;
  }
  .cap-meta{
    font-size:12px;
    color:var(--muted);
    letter-spacing:0.02em;
  }
  .photo-count{
    font-size:11px;
    color:var(--muted);
    letter-spacing:0.04em;
  }

  /* ---- dot nav ---- */
  .nav{
    position:fixed;
    right:18px;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    flex-direction:column;
    gap:10px;
    z-index:10;
  }
  .nav button{
    width:6px;
    height:6px;
    border-radius:50%;
    border:none;
    padding:0;
    background:var(--dot);
    cursor:pointer;
    transition:background .25s ease, transform .25s ease;
  }
  .nav button.active{
    background:var(--dot-active);
    transform:scale(1.6);
  }

  @media (max-width:640px){
    .nav{display:none;}
    .cover .meta{flex-direction:column; gap:2px;}
  }
</style>
</head>
<body>

<div class="viewport" id="viewport">

  <section class="cover">
    <div class="top">
      <span class="loc">15 Galaktion Tabidze St, Tbilisi</span>
    </div>
    <h1 class="title">where the body<br>fades, bitter<br>herbs grow</h1>
    <div class="bottom meta">
      <div><b>Personal exhibition</b>On show 12/09 — 26/09</div>
      <div><b>Art Studio Muse</b>Opening 12/09 19:00</div>
    </div>
    <div class="hint">scroll ↓</div>
  </section>

  <!-- artwork sections injected here -->

</div>

<div class="nav" id="nav"></div>

<script>
const works = [
  {id:"01", title:"secret", technique:"watercolour, paper", dimensions:"28x37 cm", year:2026, price:400, currency:"USD", status:"available", photos:["photos/secret.jpg"]},
  {id:"02", title:"wild", technique:"watercolour, paper", dimensions:"32x44 cm", year:2025, price:500, currency:"USD", status:"available", photos:["photos/wild.jpg"]},
  {id:"03", title:"body", technique:"watercolour, paper, ink pencil", dimensions:"30x42 cm", year:2025, price:450, currency:"USD", status:"available", photos:["photos/body.jpg"]},
  {id:"04", title:"breath", technique:"watercolour, paper", dimensions:"50x40 cm", year:2026, price:550, currency:"USD", status:"available", photos:["photos/breath.jpg"]},
  {id:"05", title:"something is taking root", technique:"watercolour", dimensions:"40x70 cm", year:2025, price:700, currency:"USD", status:"available", photos:["photos/something-is-taking-root-1.jpg","photos/something-is-taking-root-2.jpg","photos/something-is-taking-root-3.jpg","photos/something-is-taking-root-4.jpg"]},
  {id:"06", title:"a face i almost remember", technique:"watercolour, paper", dimensions:"14x21 cm", year:2025, price:null, currency:"USD", status:"sold", photos:["photos/a-face-i-almost-remember.jpg"]},
  {id:"07", title:"blooming disorder", technique:"watercolour, paper", dimensions:"25x48 cm", year:2025, price:500, currency:"USD", status:"available", photos:["photos/blooming-disorder.jpg"]},
  {id:"08", title:"soft touches", technique:"watercolour, paper", dimensions:"46x35 cm", year:2026, price:500, currency:"USD", status:"available", photos:["photos/soft-touches.jpg"]},
  {id:"09", title:"mothsomnia", technique:"watercolour, paper", dimensions:"49x26 cm", year:2026, price:450, currency:"USD", status:"available", photos:["photos/mothsomnia-1.jpg"]},
  {id:"10", title:"run through the bitter herbs", technique:"watercolour, paper", dimensions:"65x48 cm", year:null, price:700, currency:"USD", status:"available", photos:["photos/run-through-the-bitter-herbs.jpg"]},
  {id:"11", title:"spring blush", technique:"watercolour, paper", dimensions:null, year:2026, price:250, currency:"USD", status:"available", photos:["photos/spring-blush.jpg"]},
  {id:"12", title:"water lily", technique:"watercolour, paper", dimensions:"24.5x48 cm", year:2025, price:300, currency:"USD", status:"available", photos:["photos/water-lily.png"]},
  {id:"13", title:"heavenly dog", technique:"oil, hardboard", dimensions:"20x20 cm", year:2024, price:400, currency:"USD", status:"available", photos:[]},
];

const viewport = document.getElementById('viewport');
const navEl = document.getElementById('nav');

function priceLabel(w){
  if(w.status === 'sold') return 'sold';
  if(w.price == null) return '';
  return '$' + w.price;
}

function metaLine(w){
  const parts = [w.technique];
  if(w.dimensions) parts.push(w.dimensions);
  if(w.year) parts.push(String(w.year));
  return parts.filter(Boolean).join(' — ');
}

works.forEach((w, i) => {
  const section = document.createElement('section');
  section.className = 'artwork';
  section.dataset.index = i;

  const frame = document.createElement('div');
  frame.className = 'frame';

  if(w.photos.length){
    const img = document.createElement('img');
    img.className = 'artwork-img';
    img.src = w.photos[0];
    img.alt = w.title;
    let photoIdx = 0;
    if(w.photos.length > 1){
      frame.title = 'tap to see more photos';
      frame.addEventListener('click', () => {
        photoIdx = (photoIdx + 1) % w.photos.length;
        img.src = w.photos[photoIdx];
        countEl.textContent = (photoIdx+1) + ' / ' + w.photos.length;
      });
    }
    frame.appendChild(img);
  } else {
    const ph = document.createElement('div');
    ph.className = 'placeholder';
    ph.textContent = 'photo coming soon';
    frame.appendChild(ph);
  }

  const caption = document.createElement('div');
  caption.className = 'caption';

  const row = document.createElement('div');
  row.className = 'cap-row';
  const idxSpan = document.createElement('span');
  idxSpan.textContent = w.id + ' / ' + String(works.length).padStart(2,'0');
  const statusSpan = document.createElement('span');
  statusSpan.className = 'status' + (w.status === 'sold' ? ' sold' : '');
  statusSpan.textContent = priceLabel(w);
  row.appendChild(idxSpan);
  row.appendChild(statusSpan);

  const title = document.createElement('div');
  title.className = 'cap-title';
  title.textContent = w.title;

  const meta = document.createElement('div');
  meta.className = 'cap-meta';
  meta.textContent = metaLine(w);

  caption.appendChild(row);
  caption.appendChild(title);
  caption.appendChild(meta);

  var countEl;
  if(w.photos.length > 1){
    countEl = document.createElement('div');
    countEl.className = 'photo-count';
    countEl.textContent = '1 / ' + w.photos.length;
    caption.appendChild(countEl);
  }

  section.appendChild(frame);
  section.appendChild(caption);
  viewport.appendChild(section);

  const dot = document.createElement('button');
  dot.setAttribute('aria-label', w.title);
  dot.addEventListener('click', () => section.scrollIntoView({behavior:'smooth'}));
  navEl.appendChild(dot);
});

const allSections = Array.from(document.querySelectorAll('section'));
const dots = Array.from(navEl.children);

const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if(entry.isIntersecting){
      entry.target.classList.add('in-view');
      const artIdx = entry.target.dataset.index;
      dots.forEach(d => d.classList.remove('active'));
      if(artIdx !== undefined && dots[artIdx]) dots[artIdx].classList.add('active');
    }
  });
}, {root: viewport, threshold: 0.6});

allSections.forEach(s => observer.observe(s));

document.addEventListener('keydown', (e) => {
  const current = allSections.findIndex(s => {
    const r = s.getBoundingClientRect();
    return r.top >= -10 && r.top < window.innerHeight * 0.5;
  });
  if(e.key === 'ArrowDown' || e.key === 'PageDown'){
    e.preventDefault();
    const next = allSections[Math.min(current+1, allSections.length-1)];
    next && next.scrollIntoView({behavior:'smooth'});
  } else if(e.key === 'ArrowUp' || e.key === 'PageUp'){
    e.preventDefault();
    const prev = allSections[Math.max(current-1, 0)];
    prev && prev.scrollIntoView({behavior:'smooth'});
  }
});
</script>
</body>
</html>
