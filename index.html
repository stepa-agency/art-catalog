<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>where the body fades, bitter herbs grow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --ink:#141414;
    --muted:#6b6a63;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
    background:var(--bg);
    color:var(--ink);
    font-family:'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
  }
  html.grid-mode, html.grid-mode body{
    height:auto;
    overflow-y:auto;
  }

  .viewport{
    position:relative;
    z-index:2;
    height:100dvh;
    overflow-y:scroll;
    overscroll-behavior-y:contain;
    scroll-snap-type:y mandatory;
    scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;
  }
  html.grid-mode .viewport{
    display:none;
  }

  section{
    height:100dvh;
    scroll-snap-align:start;
    scroll-snap-stop:always;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:3vh 5vw;
  }

  /* ---- mode toggle ---- */
  .mode-toggle{
    position:fixed;
    top:1.5vh;
    right:5vw;
    z-index:20;
    display:flex;
    gap:7px;
    align-items:center;
    font-size:11px;
    letter-spacing:0.04em;
    text-transform:uppercase;
  }
  .mode-toggle button{
    background:none;
    border:none;
    padding:0;
    font:inherit;
    letter-spacing:inherit;
    text-transform:inherit;
    color:var(--muted);
    cursor:pointer;
  }
  .mode-toggle button.active{
    color:var(--ink);
    font-weight:700;
  }
  .mode-toggle .sep{
    color:var(--muted);
  }
  @media (max-width:639px){
    .mode-toggle{
      top:7vh;
    }
  }

  /* ---- cover ---- */
  .cover{
    text-align:left;
    align-items:flex-start;
    justify-content:space-between;
  }
  .cover .top, .cover .bottom{
    width:100%;
  }
  .cover .loc{
    font-size:11px;
    letter-spacing:0.04em;
    line-height:1.6;
    text-transform:uppercase;
    color:var(--ink);
    display:inline-block;
    padding:6px 10px;
    border:1px solid var(--ink);
  }
  .cover .title{
    font-size:clamp(26px, 8vw, 56px);
    font-weight:700;
    line-height:1.15;
    letter-spacing:-0.01em;
    max-width:14ch;
    margin:0;
    text-transform:uppercase;
  }
  .cover .meta{
    display:flex;
    flex-direction:column;
    gap:2px;
    font-size:11px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    line-height:1.7;
  }
  .cover .meta b{
    display:block;
    font-weight:700;
  }
  .cover .hint{
    position:absolute;
    bottom:3vh;
    right:5vw;
    font-size:11px;
    color:var(--muted);
    letter-spacing:0.04em;
    text-transform:uppercase;
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:0.35}
    50%{opacity:1}
  }

  @media (min-width:640px){
    .cover .meta{
      flex-direction:row;
      gap:8vw;
    }
  }

  /* ---- artwork pages ---- */
  .artwork{
    padding-bottom:18vh;
  }
  .artwork .frame{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .artwork img{
    max-width:100%;
    max-height:78dvh;
    width:auto;
    height:auto;
    object-fit:contain;
    display:block;
  }

  .placeholder{
    width:min(70vw, 420px);
    aspect-ratio:4/5;
    border:1px dashed var(--muted);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:var(--muted);
    font-size:11px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding:2em;
  }

  .caption-wrap{
    position:fixed;
    left:0;
    right:0;
    bottom:3vh;
    display:flex;
    justify-content:center;
    pointer-events:none;
    z-index:1;
    opacity:0;
    transition:opacity .2s ease;
  }
  .caption-wrap.visible{
    opacity:1;
  }
  .caption{
    width:auto;
    max-width:min(560px, 78vw);
    display:flex;
    flex-direction:column;
    gap:4px;
    opacity:1;
    transform:translateY(0);
    transition:opacity .4s ease, transform .4s ease;
  }
  .caption.enter{
    opacity:0;
    transform:translateY(10px);
    transition:none;
  }
  .cap-row{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .cap-row .status.sold{
    color:var(--ink);
    font-weight:700;
  }
  .cap-title{
    font-size:clamp(16px, 4vw, 24px);
    font-weight:500;
  }
  .cap-meta{
    font-size:11px;
    color:var(--muted);
    letter-spacing:0.02em;
  }

  /* ---- contact slide ---- */
  .contact-inner{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
    text-align:center;
  }
  .contact-lead{
    font-size:12px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .contact-handle{
    font-size:clamp(30px, 8vw, 52px);
    font-weight:700;
    letter-spacing:-0.01em;
    color:var(--ink);
    text-decoration:none;
    border-bottom:1px solid var(--ink);
    padding-bottom:6px;
    transition:opacity .25s ease;
  }
  .contact-handle:hover{
    opacity:0.55;
  }

  /* ---- grid view ---- */
  .grid-view{
    display:none;
  }
  html.grid-mode .grid-view{
    display:block;
  }
  .grid-view-inner{
    max-width:1000px;
    margin:0 auto;
    padding:calc(8vh + 34px) 5vw 8vh;
  }
  .grid-list{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6vw 3vw;
  }
  @media (min-width:640px){
    .grid-list{
      gap:5vw 4vw;
    }
  }
  .grid-item .g-frame{
    width:100%;
    aspect-ratio:4/5;
    background:#f4f2ec;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .grid-item img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .grid-item .g-placeholder{
    color:var(--muted);
    font-size:11px;
    letter-spacing:0.04em;
    text-transform:uppercase;
  }
  .grid-item .g-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-top:10px;
    gap:10px;
  }
  .grid-item .g-title{
    font-size:15px;
    font-weight:500;
  }
  .grid-item .g-price{
    font-size:11px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--muted);
    white-space:nowrap;
  }
  .grid-item .g-price.sold{
    color:var(--ink);
    font-weight:700;
  }
  .grid-item .g-meta{
    font-size:11px;
    color:var(--muted);
    margin-top:2px;
  }
</style>
</head>
<body>

<div class="mode-toggle" id="modeToggle">
  <button type="button" data-mode="scroll" class="active">Scroll</button>
  <span class="sep">/</span>
  <button type="button" data-mode="grid">Grid</button>
</div>

<div class="viewport" id="viewport">

  <section class="cover">
    <div class="top">
      <span class="loc">15 Galaktion Tabidze St, Tbilisi</span>
    </div>
    <h1 class="title">where the body<br>fades, bitter<br>herbs grow</h1>
    <div class="bottom meta">
      <div><b>Personal exhibition</b>On show 12/09 — 26/09</div>
      <div><b>Art Studio Muse</b>Opening 12/09 19:00</div>
    </div>
    <div class="hint">scroll ↓</div>
  </section>

  <!-- artwork + contact sections injected here -->

</div>

<div class="caption-wrap" id="captionWrap">
  <div class="caption" id="caption">
    <div class="cap-row">
      <span id="capIdx"></span>
      <span id="capStatus"></span>
    </div>
    <div class="cap-title" id="capTitle"></div>
    <div class="cap-meta" id="capMeta"></div>
  </div>
</div>

<div class="grid-view" id="gridView">
  <div class="grid-view-inner">
    <div class="grid-list" id="gridList"></div>
  </div>
</div>

<script>
const works = [
  {id:"01", title:"secret", technique:"watercolour, paper", dimensions:"28x37 cm", year:2026, price:400, currency:"USD", status:"available", photos:["photos/secret.jpg"]},
  {id:"02", title:"wild", technique:"watercolour, paper", dimensions:"32x44 cm", year:2025, price:500, currency:"USD", status:"available", photos:["photos/wild.jpg"]},
  {id:"03", title:"body", technique:"watercolour, paper, ink pencil", dimensions:"30x42 cm", year:2025, price:450, currency:"USD", status:"available", photos:["photos/body.jpg"]},
  {id:"04", title:"breath", technique:"watercolour, paper", dimensions:"50x40 cm", year:2026, price:550, currency:"USD", status:"available", photos:["photos/breath.jpg"]},
  {id:"05", title:"something is taking root", technique:"watercolour", dimensions:"40x70 cm", year:2025, price:700, currency:"USD", status:"available", photos:["photos/something-is-taking-root-1.jpg","photos/something-is-taking-root-2.jpg","photos/something-is-taking-root-3.jpg","photos/something-is-taking-root-4.jpg"]},
  {id:"06", title:"a face i almost remember", technique:"watercolour, paper", dimensions:"14x21 cm", year:2025, price:null, currency:"USD", status:"sold", photos:["photos/a-face-i-almost-remember.jpg"]},
  {id:"07", title:"blooming disorder", technique:"watercolour, paper", dimensions:"25x48 cm", year:2025, price:500, currency:"USD", status:"available", photos:["photos/blooming-disorder.jpg"]},
  {id:"08", title:"soft touches", technique:"watercolour, paper", dimensions:"46x35 cm", year:2026, price:500, currency:"USD", status:"available", photos:["photos/soft-touches.jpg"]},
  {id:"09", title:"mothsomnia", technique:"watercolour, paper", dimensions:"49x26 cm", year:2026, price:450, currency:"USD", status:"available", photos:["photos/mothsomnia-1.jpg"]},
  {id:"10", title:"run through the bitter herbs", technique:"watercolour, paper", dimensions:"65x48 cm", year:null, price:700, currency:"USD", status:"available", photos:["photos/run-through-the-bitter-herbs.jpg"]},
  {id:"11", title:"spring blush", technique:"watercolour, paper", dimensions:null, year:2026, price:250, currency:"USD", status:"available", photos:["photos/spring-blush.jpg"]},
  {id:"12", title:"water lily", technique:"watercolour, paper", dimensions:"24.5x48 cm", year:2025, price:300, currency:"USD", status:"available", photos:["photos/water-lily.png"]},
  {id:"13", title:"heavenly dog", technique:"oil, hardboard", dimensions:"20x20 cm", year:2024, price:400, currency:"USD", status:"available", photos:[]},
];

const viewport = document.getElementById('viewport');

function priceLabel(w){
  if(w.status === 'sold') return 'sold';
  if(w.price == null) return '';
  return '$' + w.price;
}

function metaLine(w){
  const parts = [w.technique];
  if(w.dimensions) parts.push(w.dimensions);
  if(w.year) parts.push(String(w.year));
  return parts.filter(Boolean).join(' — ');
}

function slugify(title){
  return title.toLowerCase().trim()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/(^-+|-+$)/g, '');
}

const captionWrap = document.getElementById('captionWrap');
const captionEl = document.getElementById('caption');
const capIdx = document.getElementById('capIdx');
const capStatus = document.getElementById('capStatus');
const capTitle = document.getElementById('capTitle');
const capMeta = document.getElementById('capMeta');

let activeIndex = -1;

function renderCaption(i){
  const w = works[i];
  capIdx.textContent = w.id + ' / ' + String(works.length).padStart(2,'0');
  capStatus.className = 'status' + (w.status === 'sold' ? ' sold' : '');
  capStatus.textContent = priceLabel(w);
  capTitle.textContent = w.title;
  capMeta.textContent = metaLine(w);

  const media = document.querySelector('section[data-index="'+i+'"] .frame > *');
  const mediaWidth = media ? media.getBoundingClientRect().width : 0;
  captionEl.style.width = mediaWidth > 40 ? Math.round(mediaWidth) + 'px' : '';
}

function showCaption(i){
  if(activeIndex === i) return;
  activeIndex = i;
  captionWrap.classList.add('visible');
  captionEl.classList.add('enter');
  renderCaption(i);
  void captionEl.offsetWidth;
  captionEl.classList.remove('enter');
}

function hideCaption(){
  activeIndex = -1;
  captionWrap.classList.remove('visible');
}

works.forEach((w, i) => {
  w._photoIdx = 0;

  const section = document.createElement('section');
  section.className = 'artwork';
  section.dataset.index = i;
  section.id = slugify(w.title);

  const frame = document.createElement('div');
  frame.className = 'frame';

  if(w.photos.length){
    const img = document.createElement('img');
    img.className = 'artwork-img';
    img.src = w.photos[0];
    img.alt = w.title;
    if(w.photos.length > 1){
      frame.title = 'tap to see more photos';
      frame.addEventListener('click', () => {
        w._photoIdx = (w._photoIdx + 1) % w.photos.length;
        img.src = w.photos[w._photoIdx];
      });
    }
    frame.appendChild(img);
  } else {
    const ph = document.createElement('div');
    ph.className = 'placeholder';
    ph.textContent = 'photo coming soon';
    frame.appendChild(ph);
  }

  section.appendChild(frame);
  viewport.appendChild(section);
});

const contactSection = document.createElement('section');
contactSection.className = 'contact';
contactSection.id = 'contact';
contactSection.innerHTML = `
  <div class="contact-inner">
    <div class="contact-lead">Want to buy something?<br>Text me</div>
    <a class="contact-handle" href="https://t.me/karayul" target="_blank" rel="noopener noreferrer">@karayul</a>
  </div>
`;
viewport.appendChild(contactSection);

const allSections = Array.from(document.querySelectorAll('.viewport > section'));

function updateActiveFromScroll(){
  const slot = Math.round(viewport.scrollTop / viewport.clientHeight);
  if(slot <= 0 || slot > works.length) hideCaption();
  else showCaption(slot - 1);
}

let scrollTicking = false;
viewport.addEventListener('scroll', () => {
  if(scrollTicking) return;
  scrollTicking = true;
  requestAnimationFrame(() => {
    updateActiveFromScroll();
    scrollTicking = false;
  });
});

updateActiveFromScroll();

if(location.hash){
  const target = document.getElementById(location.hash.slice(1));
  if(target) target.scrollIntoView({behavior:'instant'});
}

let gridMode = false;

document.addEventListener('keydown', (e) => {
  if(gridMode) return;
  const current = allSections.findIndex(s => {
    const r = s.getBoundingClientRect();
    return r.top >= -10 && r.top < window.innerHeight * 0.5;
  });
  if(e.key === 'ArrowDown' || e.key === 'PageDown'){
    e.preventDefault();
    const next = allSections[Math.min(current+1, allSections.length-1)];
    next && next.scrollIntoView({behavior:'smooth'});
  } else if(e.key === 'ArrowUp' || e.key === 'PageUp'){
    e.preventDefault();
    const prev = allSections[Math.max(current-1, 0)];
    prev && prev.scrollIntoView({behavior:'smooth'});
  }
});

/* grid view */
const gridList = document.getElementById('gridList');
works.forEach((w) => {
  const item = document.createElement('div');
  item.className = 'grid-item';

  const frame = document.createElement('div');
  frame.className = 'g-frame';
  if(w.photos.length){
    const img = document.createElement('img');
    img.src = w.photos[0];
    img.alt = w.title;
    frame.appendChild(img);
  } else {
    const ph = document.createElement('div');
    ph.className = 'g-placeholder';
    ph.textContent = 'photo coming soon';
    frame.appendChild(ph);
  }

  const row = document.createElement('div');
  row.className = 'g-row';
  const title = document.createElement('div');
  title.className = 'g-title';
  title.textContent = w.title;
  const price = document.createElement('div');
  price.className = 'g-price' + (w.status === 'sold' ? ' sold' : '');
  price.textContent = priceLabel(w);
  row.appendChild(title);
  row.appendChild(price);

  const meta = document.createElement('div');
  meta.className = 'g-meta';
  meta.textContent = metaLine(w);

  item.appendChild(frame);
  item.appendChild(row);
  item.appendChild(meta);
  gridList.appendChild(item);
});

const modeToggle = document.getElementById('modeToggle');
function setMode(mode){
  gridMode = mode === 'grid';
  document.documentElement.classList.toggle('grid-mode', gridMode);
  modeToggle.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  if(gridMode) hideCaption();
  else updateActiveFromScroll();
}
modeToggle.addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if(!btn) return;
  setMode(btn.dataset.mode);
});
</script>
</body>
</html>
