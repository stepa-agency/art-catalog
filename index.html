<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>where the body fades, bitter herbs grow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --ink:#141414;
    --muted:#6b6a63;
    --faint:#c4c2ba;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
    background:var(--bg);
    color:var(--ink);
    font-family:'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
    text-transform:uppercase;
  }

  .viewport{
    position:relative;
    z-index:2;
    height:100dvh;
    overflow-y:scroll;
    overscroll-behavior-y:contain;
    scroll-snap-type:y mandatory;
    scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;
  }
  html.grid-mode .viewport{
    display:none;
  }

  section{
    height:100dvh;
    scroll-snap-align:start;
    scroll-snap-stop:always;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:3vh 5vw;
  }

  /* ---- mode toggle ---- */
  .mode-toggle{
    position:fixed;
    top:1.5vh;
    right:5vw;
    z-index:20;
    display:flex;
    gap:7px;
    align-items:center;
    font-size:11px;
    letter-spacing:0.04em;
    text-transform:uppercase;
  }
  .mode-toggle button{
    background:none;
    border:none;
    padding:0;
    font:inherit;
    letter-spacing:inherit;
    text-transform:inherit;
    color:var(--muted);
    cursor:pointer;
  }
  .mode-toggle button.active{
    color:var(--ink);
    font-weight:700;
  }
  .mode-toggle .sep{
    color:var(--muted);
  }
  @media (max-width:639px){
    .mode-toggle{
      top:calc(7vh - 10px);
    }
  }

  .buy-link{
    position:fixed;
    top:1.5vh;
    left:5vw;
    z-index:20;
    font-size:11px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:400;
    text-decoration:none;
    transition:opacity .2s ease;
  }
  .buy-link:hover{
    opacity:0.55;
  }
  @media (max-width:639px){
    .buy-link{
      top:calc(7vh - 10px);
    }
  }

  /* ---- cover ---- */
  .cover{
    text-align:left;
    align-items:flex-start;
    justify-content:space-between;
    padding-bottom:16vh;
  }
  .cover .bottom{
    width:100%;
  }
  .cover .title-group{
    margin-top:9vh;
  }
  .cover .catalog-label,
  .cover .title{
    font-size:clamp(24px, min(8.6vw, 9.2vh), 68px);
    font-weight:700;
    line-height:1.05;
    letter-spacing:-0.01em;
    max-width:14ch;
    margin:0;
  }
  .cover .catalog-label{
    color:var(--faint);
  }
  @media (min-width:640px){
    .cover .title-group{
      margin-top:4vh;
    }
  }
  .cover .meta{
    display:flex;
    flex-direction:column;
    gap:2px;
    font-size:11px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    line-height:1.7;
  }
  .cover .meta b{
    display:block;
    font-weight:700;
  }
  @media (max-width:639px){
    .cover .meta{
      flex-direction:row;
      align-items:flex-end;
      justify-content:space-between;
      gap:6vw;
    }
    .cover .meta .meta-left{
      display:flex;
      flex-direction:column;
      gap:2px;
    }
    .cover .meta .address{
      text-align:right;
      max-width:14ch;
    }
  }
  .cover .scroll-cue{
    position:absolute;
    left:5vw;
    right:5vw;
    bottom:3vh;
    display:flex;
    justify-content:space-between;
    align-items:center;
    pointer-events:none;
  }
  .cover .scroll-arrow{
    width:18px;
    height:18px;
    flex:none;
    color:var(--ink);
    animation:bounce 1.5s ease-in-out infinite;
  }
  @keyframes bounce{
    0%,100%{ transform:translateY(0); opacity:0.4; }
    50%{ transform:translateY(7px); opacity:1; }
  }

  @media (min-width:640px){
    .cover{
      padding-bottom:10vh;
    }
    .cover .meta{
      flex-direction:row;
      align-items:flex-end;
      gap:6vw;
      flex-wrap:wrap;
    }
    .cover .meta .meta-left{
      display:contents;
    }
    .cover .meta .address{
      max-width:24ch;
    }
  }

  /* ---- artwork pages ---- */
  .artwork{
    padding-bottom:18vh;
    padding-left:2vw;
    padding-right:2vw;
  }
  .artwork .frame{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .artwork img{
    max-width:100%;
    max-height:78dvh;
    width:auto;
    height:auto;
    object-fit:contain;
    display:block;
  }

  .placeholder{
    width:min(70vw, 420px);
    aspect-ratio:4/5;
    border:1px dashed var(--muted);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:var(--muted);
    font-size:11px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding:2em;
  }

  .caption-wrap{
    position:fixed;
    left:0;
    right:0;
    bottom:3vh;
    display:flex;
    justify-content:center;
    pointer-events:none;
    z-index:1;
    opacity:0;
    transition:opacity .2s ease;
  }
  .caption-wrap.visible{
    opacity:1;
  }
  .caption{
    width:auto;
    max-width:min(560px, 78vw);
    display:flex;
    flex-direction:column;
    gap:4px;
    opacity:1;
    transform:translateY(0);
    transition:opacity .4s ease, transform .4s ease;
  }
  .caption.enter{
    opacity:0;
    transform:translateY(10px);
    transition:none;
  }
  .cap-row{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .cap-row .status.sold{
    color:var(--ink);
    font-weight:700;
  }
  .cap-title{
    font-size:clamp(16px, 4vw, 24px);
    font-weight:500;
  }
  .cap-meta{
    font-size:11px;
    color:var(--muted);
    letter-spacing:0.02em;
  }
  @media (max-width:639px){
    .caption-wrap{
      left:5vw;
      right:5vw;
      bottom:auto;
      top:calc(100dvh - 132px);
      align-items:flex-start;
      justify-content:flex-start;
    }
    .caption{
      width:100%;
      max-width:none;
    }
  }

  /* ---- contact slide ---- */
  .contact-inner{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
    text-align:center;
  }
  .contact-lead{
    font-size:12px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .contact-handle{
    font-size:clamp(30px, 8vw, 52px);
    font-weight:700;
    letter-spacing:-0.01em;
    color:var(--ink);
    text-decoration:none;
    border-bottom:1px solid var(--ink);
    padding-bottom:6px;
    transition:opacity .25s ease;
  }
  .contact-handle:hover{
    opacity:0.55;
  }

  /* ---- grid view ---- */
  .grid-view{
    display:none;
  }
  html.grid-mode .grid-view{
    display:block;
    position:fixed;
    inset:0;
    z-index:3;
    background:var(--bg);
    overflow-y:auto;
    overscroll-behavior-y:contain;
    -webkit-overflow-scrolling:touch;
  }
  .grid-view-inner{
    max-width:1900px;
    margin:0 auto;
    padding:calc(8vh + 34px) 5vw 8vh;
  }
  .grid-list{
    column-count:2;
    column-gap:3vw;
  }
  @media (min-width:640px){
    .grid-list{
      column-gap:4vw;
    }
  }
  @media (min-width:900px){
    .grid-list{
      column-count:4;
      column-gap:2.5vw;
    }
  }
  .grid-item{
    display:inline-block;
    width:100%;
    break-inside:avoid;
    -webkit-column-break-inside:avoid;
    margin-bottom:6vw;
    color:inherit;
    text-decoration:none;
  }
  @media (min-width:900px){
    .grid-item{
      margin-bottom:3vw;
    }
  }
  .grid-item .g-frame{
    width:100%;
    display:block;
  }
  .grid-item .g-placeholder-frame{
    aspect-ratio:4/5;
    background:#f4f2ec;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .grid-item img{
    width:100%;
    height:auto;
    display:block;
  }
  .grid-item .g-placeholder{
    color:var(--muted);
    font-size:11px;
    letter-spacing:0.04em;
    text-transform:uppercase;
  }
  .grid-item .g-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-top:10px;
    gap:10px;
  }
  .grid-item .g-title{
    font-size:15px;
    font-weight:500;
  }
  .grid-item .g-price{
    font-size:11px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--muted);
    white-space:nowrap;
  }
  .grid-item .g-price.sold{
    color:var(--ink);
    font-weight:700;
  }
  .grid-item .g-meta{
    font-size:11px;
    color:var(--muted);
    margin-top:2px;
  }
</style>
</head>
<body>

<div class="mode-toggle" id="modeToggle">
  <button type="button" data-mode="scroll" class="active">Scroll</button>
  <span class="sep">/</span>
  <button type="button" data-mode="grid">Grid</button>
</div>

<a class="buy-link" href="https://www.instagram.com/kindermilo/" target="_blank" rel="noopener noreferrer">Buy</a>

<div class="viewport" id="viewport">

  <section class="cover">
    <div class="title-group">
      <h1 class="title">Kareva Yulia.<br>where the body<br>fades, bitter<br>herbs grow</h1>
      <div class="catalog-label">Catalogue</div>
    </div>
    <div class="bottom meta">
      <div class="meta-left">
        <div><b>Personal exhibition</b>On show 12/09 — 26/09</div>
        <div><b>Art Studio Muse</b>Opening 12/09 19:00</div>
      </div>
      <div class="address">15 Galaktion Tabidze St, Tbilisi</div>
    </div>
    <div class="scroll-cue">
      <svg class="scroll-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
      <svg class="scroll-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
      <svg class="scroll-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </div>
  </section>

  <!-- artwork + contact sections injected here -->

</div>

<div class="caption-wrap" id="captionWrap">
  <div class="caption" id="caption">
    <div class="cap-row">
      <span id="capIdx"></span>
      <span id="capStatus"></span>
    </div>
    <div class="cap-title" id="capTitle"></div>
    <div class="cap-meta" id="capMeta"></div>
  </div>
</div>

<div class="grid-view" id="gridView">
  <div class="grid-view-inner">
    <div class="grid-list" id="gridList"></div>
  </div>
</div>

<script>
// --- works: сгенерировано tools/sync-works.py из catalog.json ---
const works = [
  {id:"01", title:"secret", technique:"watercolour on paper", dimensions:"28x37 cm", year:2026, price:400, currency:"USD", status:"available", photos:["photos/secret.jpg"]},
  {id:"02", title:"wild", technique:"watercolour on paper", dimensions:"32x44 cm", year:2025, price:500, currency:"USD", status:"available", photos:["photos/wild.jpg"]},
  {id:"03", title:"body", technique:"watercolour and ink pencil on paper", dimensions:"30x42 cm", year:2025, price:450, currency:"USD", status:"available", photos:["photos/body.jpg"]},
  {id:"04", title:"breath", technique:"watercolour on paper", dimensions:"50x40 cm", year:2026, price:550, currency:"USD", status:"available", photos:["photos/breath.jpg"]},
  {id:"05", title:"something is taking root", technique:"watercolour on paper", dimensions:"40x70 cm", year:2025, price:700, currency:"USD", status:"available", photos:["photos/something-is-taking-root-1.jpg", "photos/something-is-taking-root-2.jpg", "photos/something-is-taking-root-3.jpg", "photos/something-is-taking-root-4.jpg"]},
  {id:"06", title:"a face i almost remember", technique:"watercolour on paper", dimensions:"14x21 cm", year:2025, price:null, currency:"USD", status:"sold", photos:["photos/a-face-i-almost-remember.jpg"]},
  {id:"07", title:"blooming disorder", technique:"watercolour on paper", dimensions:"25x48 cm", year:2025, price:500, currency:"USD", status:"available", photos:["photos/blooming-disorder.jpg"]},
  {id:"08", title:"soft touches", technique:"watercolour on paper", dimensions:"46x35 cm", year:2026, price:600, currency:"USD", status:"available", photos:["photos/soft-touches.jpg"]},
  {id:"09", title:"mothsomnia", technique:"watercolour on paper", dimensions:"49x26 cm", year:2026, price:450, currency:"USD", status:"available", photos:["photos/mothsomnia-1.jpg"]},
  {id:"10", title:"run through the bitter herbs", technique:"watercolour on paper", dimensions:"65x48 cm", year:null, price:750, currency:"USD", status:"available", photos:["photos/run-through-the-bitter-herbs.jpg"]},
  {id:"11", title:"spring blush", technique:"watercolour on paper", dimensions:null, year:2026, price:250, currency:"USD", status:"available", photos:["photos/spring-blush.jpg"]},
  {id:"12", title:"water lily", technique:"watercolour on paper", dimensions:"24.5x48 cm", year:2025, price:300, currency:"USD", status:"available", photos:["photos/water-lily.jpg"]},
  {id:"13", title:"heavenly dog", technique:"oil on hardboard", dimensions:"20x20 cm", year:2024, price:400, currency:"USD", status:"available", photos:[]},
  {id:"14", title:"forest women", technique:"watercolour on paper", dimensions:"33.5x43.5 cm", year:2021, price:500, currency:"USD", status:"available", photos:["photos/forest-women.jpg"]},
  {id:"15", title:"under the haze", technique:"watercolour and tempera on paper", dimensions:null, year:2026, price:400, currency:"USD", status:"available", photos:["photos/under-the-haze.jpg"]},
  {id:"16", title:"beast", technique:"mixed media on paper", dimensions:"21x29 cm", year:2026, price:300, currency:"USD", status:"available", photos:[]},
  {id:"17", title:"herbarium", technique:"mixed media collage", dimensions:null, year:2026, price:300, currency:"USD", status:"available", photos:[]},
  {id:"18", title:"raw face", technique:"watercolour on paper", dimensions:"14.5x21 cm", year:2026, price:200, currency:"USD", status:"available", photos:["photos/raw-face.jpg"]},
  {id:"19", title:"a cow i saw in a dream", technique:"oil on canvas", dimensions:"50x60 cm", year:2024, price:850, currency:"USD", status:"available", photos:["photos/a-cow-i-saw-in-a-dream.jpg"]},
  {id:"20", title:"bitter herbs", technique:"oil on textile, series of 5", dimensions:"35x150, 50x150, 40x150, 50x150, 35x150 cm", year:2026, price:300, priceNote:"each", currency:"USD", status:"available", photos:["photos/bitter-herbs.jpg"]},
];
// --- /works ---

const viewport = document.getElementById('viewport');

function priceLabel(w){
  if(w.status === 'sold') return 'sold';
  if(w.price == null) return '';
  return '$' + w.price + (w.priceNote ? ' ' + w.priceNote : '');
}

function metaLine(w){
  const parts = [w.technique];
  if(w.dimensions) parts.push(w.dimensions);
  if(w.year) parts.push(String(w.year));
  return parts.filter(Boolean).join(' — ');
}

function slugify(title){
  return title.toLowerCase().trim()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/(^-+|-+$)/g, '');
}

const captionWrap = document.getElementById('captionWrap');
const captionEl = document.getElementById('caption');
const capIdx = document.getElementById('capIdx');
const capStatus = document.getElementById('capStatus');
const capTitle = document.getElementById('capTitle');
const capMeta = document.getElementById('capMeta');

let activeIndex = -1;

function renderCaption(i){
  const w = works[i];
  if(!w) return;
  capIdx.textContent = w.id + ' / ' + String(works.length).padStart(2,'0');
  capStatus.className = 'status' + (w.status === 'sold' ? ' sold' : '');
  capStatus.textContent = priceLabel(w);
  capTitle.textContent = w.title;
  capMeta.textContent = metaLine(w);

  if(window.matchMedia('(max-width:639px)').matches){
    captionEl.style.width = '';
  } else {
    const media = document.querySelector('section[data-index="'+i+'"] .frame > *');
    const mediaWidth = media ? media.getBoundingClientRect().width : 0;
    captionEl.style.width = mediaWidth > 40 ? Math.round(mediaWidth) + 'px' : '';
  }
}

function showCaption(i){
  if(activeIndex === i) return;
  activeIndex = i;
  captionWrap.classList.add('visible');
  captionEl.classList.add('enter');
  renderCaption(i);
  void captionEl.offsetWidth;
  captionEl.classList.remove('enter');
}

function hideCaption(){
  activeIndex = -1;
  captionWrap.classList.remove('visible');
}

works.forEach((w, i) => {
  w._photoIdx = 0;

  const section = document.createElement('section');
  section.className = 'artwork';
  section.dataset.index = i;
  section.id = slugify(w.title);

  const frame = document.createElement('div');
  frame.className = 'frame';

  if(w.photos.length){
    const img = document.createElement('img');
    img.className = 'artwork-img';
    img.loading = i === 0 ? 'eager' : 'lazy';
    img.decoding = 'async';
    if(w.photoSizes && w.photoSizes[0]){
      img.width = w.photoSizes[0][0];
      img.height = w.photoSizes[0][1];
    }
    img.src = w.photos[0];
    img.alt = w.title;
    if(w.photos.length > 1){
      frame.title = 'tap to see more photos';
      frame.addEventListener('click', () => {
        w._photoIdx = (w._photoIdx + 1) % w.photos.length;
        img.src = w.photos[w._photoIdx];
      });
    }
    frame.appendChild(img);
  } else {
    const ph = document.createElement('div');
    ph.className = 'placeholder';
    ph.textContent = 'photo coming soon';
    frame.appendChild(ph);
  }

  section.appendChild(frame);
  viewport.appendChild(section);
});

const contactSection = document.createElement('section');
contactSection.className = 'contact';
contactSection.id = 'contact';
contactSection.innerHTML = `
  <div class="contact-inner">
    <div class="contact-lead">Want to buy something?<br>Text me</div>
    <a class="contact-handle" href="https://www.instagram.com/kindermilo/" target="_blank" rel="noopener noreferrer">kindermilo</a>
  </div>
`;
viewport.appendChild(contactSection);

const allSections = Array.from(document.querySelectorAll('.viewport > section'));

function updateActiveFromScroll(){
  const pageHeight = viewport.clientHeight;
  const slot = pageHeight ? Math.round(viewport.scrollTop / pageHeight) : 0;
  if(!(slot > 0) || slot > works.length) hideCaption();
  else showCaption(slot - 1);
}

let scrollTicking = false;
viewport.addEventListener('scroll', () => {
  if(scrollTicking) return;
  scrollTicking = true;
  requestAnimationFrame(() => {
    updateActiveFromScroll();
    scrollTicking = false;
  });
});

updateActiveFromScroll();

if(location.hash){
  const target = document.getElementById(location.hash.slice(1));
  if(target) target.scrollIntoView({behavior:'instant'});
}

let gridMode = false;

document.addEventListener('keydown', (e) => {
  if(gridMode) return;
  const current = allSections.findIndex(s => {
    const r = s.getBoundingClientRect();
    return r.top >= -10 && r.top < window.innerHeight * 0.5;
  });
  if(e.key === 'ArrowDown' || e.key === 'PageDown'){
    e.preventDefault();
    const next = allSections[Math.min(current+1, allSections.length-1)];
    next && next.scrollIntoView({behavior:'smooth'});
  } else if(e.key === 'ArrowUp' || e.key === 'PageUp'){
    e.preventDefault();
    const prev = allSections[Math.max(current-1, 0)];
    prev && prev.scrollIntoView({behavior:'smooth'});
  }
});

/* grid view */
const gridList = document.getElementById('gridList');
works.forEach((w) => {
  const slug = slugify(w.title);
  const item = document.createElement('a');
  item.className = 'grid-item';
  item.href = '#' + slug;
  item.addEventListener('click', (e) => {
    e.preventDefault();
    setMode('scroll');
    requestAnimationFrame(() => {
      const target = document.getElementById(slug);
      if(target) target.scrollIntoView({behavior:'instant'});
      history.replaceState(null, '', '#' + slug);
    });
  });

  const frame = document.createElement('div');
  frame.className = 'g-frame';
  if(w.photos.length){
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.decoding = 'async';
    if(w.photoSizes && w.photoSizes[0]){
      img.width = w.photoSizes[0][0];
      img.height = w.photoSizes[0][1];
    }
    img.src = w.photos[0];
    img.alt = w.title;
    frame.appendChild(img);
  } else {
    frame.classList.add('g-placeholder-frame');
    const ph = document.createElement('div');
    ph.className = 'g-placeholder';
    ph.textContent = 'photo coming soon';
    frame.appendChild(ph);
  }

  const row = document.createElement('div');
  row.className = 'g-row';
  const title = document.createElement('div');
  title.className = 'g-title';
  title.textContent = w.title;
  const price = document.createElement('div');
  price.className = 'g-price' + (w.status === 'sold' ? ' sold' : '');
  price.textContent = priceLabel(w);
  row.appendChild(title);
  row.appendChild(price);

  const meta = document.createElement('div');
  meta.className = 'g-meta';
  meta.textContent = metaLine(w);

  item.appendChild(frame);
  item.appendChild(row);
  item.appendChild(meta);
  gridList.appendChild(item);
});

const modeToggle = document.getElementById('modeToggle');
function setMode(mode){
  gridMode = mode === 'grid';
  document.documentElement.classList.toggle('grid-mode', gridMode);
  modeToggle.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  if(gridMode) hideCaption();
  else updateActiveFromScroll();
}
modeToggle.addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if(!btn) return;
  setMode(btn.dataset.mode);
});
</script>
</body>
</html>
